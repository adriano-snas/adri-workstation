name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: test
          REDIS_PASSWORD: test
          N8N_ENCRYPTION_KEY: test
          WEBUI_SECRET_KEY: test
        run: docker compose config --quiet
